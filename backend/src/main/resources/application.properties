# Recovery & Performance Tracker — backend
# Runs on port 8080. The backend serves the frontend itself: at build time
# the frontend files are copied into target/classes/static (see pom.xml),
# so one run serves the app at http://localhost:8080/ and the API at
# http://localhost:8080/api/* — no second server needed.
server.port=8080

# H2 FILE database, so data persists across restarts.
# The file lives in backend/data/recovery-db.mv.db. Delete that file to start empty.
spring.datasource.url=jdbc:h2:file:./data/recovery-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
