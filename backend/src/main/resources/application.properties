# Recovery & Performance Tracker — backend
# Runs on port 8080. Frontend is served separately (e.g. python3 -m http.server 8000).
server.port=8080

# H2 FILE database, so data persists across restarts.
# The file lives in backend/data/recovery-db.mv.db. Delete that file to start empty.
spring.datasource.url=jdbc:h2:file:./data/recovery-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
